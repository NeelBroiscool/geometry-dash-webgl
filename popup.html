<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Dash | Game</title>
    <style>
      :root {
        --bg-dark: #070b14;
        --bg-mid: #111a2d;
        --panel: rgba(15, 20, 30, 0.8);
        --cyan: #66f0ff;
        --blue: #4d8bff;
        --pink: #ff4ec9;
        --yellow: #ffd166;
        --red: #ff4d6d;
        --white: #ecf8ff;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg-dark);
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
      }

      .game-body {
        position: relative;
        background: linear-gradient(180deg, #0a1222, #091421);
      }

      #gameCanvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #0a1020;
        cursor: pointer;
      }

      #hud {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 10;
        pointer-events: none;
        font-family: 'Courier New', monospace;
      }

      #scoreBox {
        display: inline-block;
        background: rgba(7, 17, 27, 0.6);
        color: var(--white);
        border: 1px solid rgba(102, 240, 255, 0.45);
        border-radius: 10px;
        padding: 10px 16px;
        font-weight: 700;
        letter-spacing: 0.05em;
        box-shadow: 0 0 18px rgba(102, 240, 255, 0.15);
      }

      #bestScoreBox {
        display: inline-block;
        margin-left: 12px;
        background: rgba(7, 17, 27, 0.6);
        color: rgba(255, 209, 102, 0.9);
        border: 1px solid rgba(255, 209, 102, 0.35);
        border-radius: 10px;
        padding: 10px 16px;
        font-weight: 700;
        letter-spacing: 0.05em;
        box-shadow: 0 0 18px rgba(255, 209, 102, 0.1);
      }

      #gameOver {
        margin-top: 10px;
        background: rgba(255, 77, 109, 0.18);
        border: 1px solid rgba(255, 77, 109, 0.6);
        color: #fff2f4;
        font-weight: 700;
        padding: 10px 14px;
        border-radius: 10px;
        box-shadow: 0 0 18px rgba(255, 77, 109, 0.2);
        animation: pulse-error 0.6s ease-in-out;
      }

      @keyframes pulse-error {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
    </style>
  </head>
  <body class="game-body">
    <div id="hud">
      <div id="scoreBox">Score: <span id="score">0</span></div>
      <div id="bestScoreBox">Best: <span id="bestScore">0</span></div>
      <div id="gameOver" hidden>Press SPACE or Click to Restart</div>
    </div>

    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <script src="js/config.js"></script>
    <script src="js/shader.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/obstacle.js"></script>
    <script src="js/player.js"></script>
    <script src="js/input.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
